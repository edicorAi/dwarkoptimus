services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-systems-calculator:local
    container_name: dwarkoptimus
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
